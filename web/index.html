<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ekeko · Vitrina digital de negocios bolivianos. Productos, tiendas y contacto por WhatsApp.">
  <meta name="theme-color" content="#1667A6">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ekeko">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ekeko · Vitrina boliviana</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body { margin: 0; background: #FBF6EF; }
    #ekeko-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(135deg, #21A56B, #1667A6 55%, #0E456F);
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif; z-index: 9999;
      transition: opacity .4s ease; color: #fff;
    }
    #ekeko-splash .logo {
      width: 92px; height: 92px; border-radius: 26px; display: grid; place-items: center;
      background: rgba(255,255,255,.16); border: 2px solid rgba(255,255,255,.3);
      font-size: 48px; box-shadow: 0 12px 30px rgba(0,0,0,.25);
    }
    #ekeko-splash h1 { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -.5px; }
    #ekeko-splash p { margin: 0; opacity: .9; font-size: 14px; font-weight: 600; }
    #ekeko-splash .bar { width: 120px; height: 4px; border-radius: 99px; background: rgba(255,255,255,.25); overflow: hidden; }
    #ekeko-splash .bar::after { content: ''; display: block; width: 40%; height: 100%; background: #fff; border-radius: 99px; animation: slide 1.1s infinite ease-in-out; }
    @keyframes slide { 0% { transform: translateX(-120%);} 100% { transform: translateX(320%);} }
  </style>
</head>
<body>
  <div id="ekeko-splash">
    <div class="logo">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.5 5.2 4h13.6L20 9.5"/>
        <path d="M4 9.5a2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0"/>
        <path d="M5 11v9h14v-9"/><path d="M9.5 20v-5h5v5"/>
      </svg>
    </div>
    <div style="text-align:center">
      <h1>Ekeko</h1>
      <p>Vitrina digital boliviana</p>
    </div>
    <div class="bar"></div>
  </div>

  <script>
    // Oculta el splash cuando la primera vista de Flutter ya pintó.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('ekeko-splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 450); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
